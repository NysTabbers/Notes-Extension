<!DOCTYPE html>
<html>

<head>
    <title>Notes Extension</title>
    <link rel="stylesheet" href="popup.css">
</head>

<body>
    <!-- Main container — all views live inside here -->
    <div class="container" id="container">

        <!-- Page title — text content is swapped by JS depending on the active view -->
        <h1 class="title" id="title">My Notes</h1>

        <!-- HOME VIEW: grid of sticky note cards, built dynamically by showHome() -->
        <div id="home-view">
            <div class="note-content" id="note-content"></div>
        </div>

        <!-- NOTE DETAIL VIEW: shows full content of a single note when a card is clicked.
             Hidden by default; JS removes "hidden" when a note is opened. -->
        <div id="note-detail-view" class="note-detail-card hidden">
            <a id="detail-url" class="note-detail-url" target="_blank"></a>
            <p id="detail-text" class="note-detail-text"></p>
            <button id="detail-back" class="back-button">Back</button>
            <button id="detail-edit" class="edit-button">Edit</button>
            <button id="detail-delete" class="delete-button">Delete</button>
        </div>

        <!-- CONFIRM DELETE DIALOG: overlaid when the user clicks Delete on a note -->
        <div id="confirm-delete" class="confirm-delete hidden">
            <p>Are you sure you want to delete this note?</p>
            <button id="confirm-delete-btn">Yes, delete</button>
            <button id="cancel-delete-btn">No, keep it</button>
        </div>

        <!-- Semi-transparent backdrop shown behind any confirmation dialog -->
        <div id="confirm-overlay" class="confirm-overlay hidden"></div>

        <!-- CONFIRM CLEAR ALL DIALOG: overlaid when "Clear all notes" is clicked in settings -->
        <div id="confirm-clear-all" class="confirm-clear-all hidden">
            <p>Are you sure you want to clear all notes?</p>
            <button id="confirm-clear-btn" class="confirm-clear-btn">Yes, clear all</button>
            <button id="cancel-clear-btn" class="cancel-clear-btn">No, keep them</button>
        </div>

        <!-- NEW NOTE VIEW: form for creating a text note -->
        <div id="new-note-view" class="hidden">
            <h2>Create a new note</h2>
            <input id="note-title" placeholder="Title" class="note-input" />
            <input id="note-url" placeholder="Link (URL)" class="note-input" />
            <div>
                <label>Choose color</label>
                <!-- Colour swatches are injected here dynamically by setupColorPalette() -->
                <div id="color-palette" class="color-palette"></div>
            </div>
            <textarea id="note-text" rows="6" class="note-textarea"></textarea>
            <button id="save-note">Save</button>
            <button id="cancel-note">Cancel</button>
        </div>

        <!-- VOICE NOTE VIEW: form for recording and saving a voice note -->
        <div id="voiceRecording" class="hidden">
            <h2>Create new voice note</h2>
            <input id="audio-note-title" placeholder="Title" class="note-input" />
            <!-- Auto-filled with the current tab URL if auto-link setting is enabled -->
            <input id="audio-note-url" placeholder="Link (URL)" class="note-input" />
            <div>
                <label>Choose color</label>
                <!-- Separate palette container from the edit view to avoid ID conflicts -->
                <div id="color-palette-voice-note" class="color-palette"></div>
            </div>
            <!-- Status label updated by JS: displays "🔴 Recording..." or "⏳ Saving..." -->
            <p id="recording-status" style="font-size:13px; margin: 6px 0;"></p>
            <button id="startRecording" class="startRecording">Start Recording</button>
            <!-- Starts disabled; JS enables it once recording has begun -->
            <button id="stopRecording" class="stopRecording" disabled>Stop Recording</button>
        </div>

        <!-- EDIT NOTE VIEW: pre-filled form for updating an existing note -->
        <div id="edit-Note" class="hidden">
            <h2>Edit Note</h2>
            <input id="edit-note-title" placeholder="Title" class="note-input" />
            <input id="edit-note-url" placeholder="Link (URL)" class="note-input" />
            <div>
                <label>Choose color</label>
                <div id="edit-color-palette" class="color-palette"></div>
            </div>
            <textarea id="edit-note-text" rows="6" class="note-textarea"></textarea>
            <button id="update-note">Update</button>
            <button id="cancel-edit-note">Cancel</button>
        </div>

        <!-- SETTINGS VIEW: auto-link toggle and destructive clear-all button -->
        <div id="settings-view" class="hidden">
            <h2>Settings</h2>
            <label>
                <input type="checkbox" id="auto-link-toggle" />
                Auto-grab website link when creating notes
            </label>
            <button id="clear-notes" class="clear-notes">Clear all notes</button>
        </div>

    </div>

    <!-- FOOTER NAV: fixed at the bottom, always visible regardless of active view -->
    <div class="footer-container" id="footer-container">
        <div class="footer" id="footer">
            <button class="home-button" id="home-button">Home</button>
            <button class="make-new-notes" id="make-new-notes">Make New Note</button>
            <button id="makeVoiceRecording" class="makeVoiceRecording">Recorder</button>
            <button class="setting-button" id="setting-button">Settings</button>
        </div>
    </div>

    <script src="popup.js"></script>
</body>

</html>
